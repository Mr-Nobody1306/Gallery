<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <title>Dashboard</title>
</head>
    

<body>
    <section class="page">
    <nav>
        <div class="logo">
            <img src="photo-camera.png" alt="logo">
            <p style="font-family:'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;font-size: 18px;font-weight:500;line-height: 22px;"><i class="great-vibes-regular">Nicole's</i><br> GALLERY</p>
        </div>
        <button class="burger-btn">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <ul class="menu">
            <li><a href="">HOME </a></li>
            <li><a href="">PHOTOS </a></li>
            <li><a href="">ALBUM </a></li>
            <li><a href="">LOGOUT</a></li>
        </ul>
    </nav>
    <section class="search-section">
            <form id="searchform">
        <input type="text" name="search" placeholder="Search by album or date">
        <button type="submit" id="search">&#8981;</button>

        <p id="results"></p>
    </form>
    </section>
    <section class="hero">
       
  <h1>Albums</h1>
  <p class="subtitle">Your photo collections · 6 albums total</p>

  <div class="albums-grid">
    
    <!-- Album Card 1 -->
    <div class="album-card">
      <div class="album-preview">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=400" alt="Beach">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=400" alt="Palm">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=400" alt="Ocean">
      </div>
      <h3 class="album-title">Summer Vacation 2024</h3>
      <div class="album-meta">
        <span>📁 128 photos</span>
        <span>📅 Jun 12, 2024</span>
      </div>
    </div>

    <!-- Album Card 2 -->
    <div class="album-card">
      <div class="album-preview">
        <img src="https://images.unsplash.com/photo-1519741497674-611481863552?w=400" alt="Bouquet">
        <img src="https://images.unsplash.com/photo-1511795409834-ef04bbd61622?w=400" alt="Rings">
        <img src="https://images.unsplash.com/photo-1465495976277-4387d4b0e4a6?w=400" alt="Couple">
      </div>
      <h3 class="album-title">Wedding Day</h3>
      <div class="album-meta">
        <span>📁 76 photos</span>
        <span>📅 May 20, 2024</span>
      </div>
    </div>

    <!-- Album Card 3 -->
    <div class="album-card">
      <div class="album-preview">
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?w=400" alt="Mountain">
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=400" alt="Trail">
        <img src="https://images.unsplash.com/photo-1439853949127-fa6474139422?w=400" alt="Lake">
      </div>
      <h3 class="album-title">Mountain Hike</h3>
      <div class="album-meta">
        <span>📁 92 photos</span>
        <span>📅 Apr 03, 2024</span>
      </div>
    </div>

  </div>
    </section>
    </section>
    <script src="actions/ajax.js"></script>
</body>

</html>
