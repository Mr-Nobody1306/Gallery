<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/form.css">
    <title>Sign-Up</title>
</head>
<body>
    <div class="title">Nicole's gallery</div>
    <section class="container">
        <section class="form-image">
            <div class="text">
                <h1>Welcome to Nicole's Gallery</h1>
                <p>Where every picture tells a story <br>Sign up and step inside</p>
            </div>
        </section>
        <section class="form-container">
            <h2 id="greeting"></h2>
            <form id="signupForm">
                <input type="text" name="username" id="username" placeholder="Username" required>
                <input type="email" name="email" id="email" placeholder="Email" required>
                <input type="password" name="password" id="password" placeholder="Key" required>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="Confirm key" required>
                <div id="formError" class="form-message"></div>
                <button type="submit">Sign up</button>
                <p style="margin: 20px;">Already have an account? <a href="login.html">Login</a></p>
            </form>
        </section>
    </section>
    <script src="actions/ajax.js"></script>
</body>
</html>
